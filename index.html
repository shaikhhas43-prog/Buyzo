<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUYZO — Shop Smart</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="brand"><img src="assets/buyzo-logo.png"></div>
  <div class="search"><input id="search" placeholder="Search products..." oninput="searchProducts()"><button>Search</button></div>
  <div class="actions"><button onclick="openAuth()">👤 Account</button><button>🛒 <b id="cartCount">0</b></button></div>
</header>
<nav class="cats"><button>All</button><button>Fashion</button><button>Mobiles</button><button>Electronics</button><button>Home</button><button>Beauty</button></nav>

<main>
<section class="hero"><div><small>WELCOME TO BUYZO</small><h1>Great deals.<br>Smart shopping.</h1><p>Shop from trusted sellers and discover products you'll love.</p><button class="primary">Shop Now</button></div><img src="assets/buyzo-logo.png"></section>
<section><div class="title"><h2>Top Categories</h2><span>View all →</span></div><div class="category-grid">
<div>📱<small>Mobiles</small></div><div>👕<small>Fashion</small></div><div>💻<small>Electronics</small></div><div>🏠<small>Home</small></div><div>💄<small>Beauty</small></div><div>⚽<small>Sports</small></div>
</div></section>
<section><div class="title"><h2>Trending Products</h2><span>View all →</span></div><div id="products" class="products"></div></section>
</main>

<div id="auth" class="overlay" onclick="if(event.target===this)closeAuth()">
<div class="modal"><button class="close" onclick="closeAuth()">×</button><img src="assets/buyzo-logo.png" class="authlogo">
<div class="tabs"><button id="loginTab" class="active" onclick="showLogin()">Login</button><button id="signupTab" onclick="showSignup()">Create Account</button></div>
<form id="authForm" onsubmit="submitAuth(event)"></form><p id="message"></p>
</div></div>
<footer>© 2026 BUYZO · Buy Smart. Buyzo.</footer>
<script src="app.js"></script>
</body></html>
