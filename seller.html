<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BUYZO Seller Panel</title>

  <link rel="stylesheet" href="seller.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="top">
  <div class="logo">
    BUY<span>ZO</span>
    <small>SELLER</small>
  </div>

  <div class="account">
    <span id="email"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>


<!-- LOGIN -->

<div id="login" class="login-page">

  <div class="login-box">

    <div class="brand">
      BUY<span>ZO</span>
    </div>

    <h1>Seller Login</h1>

    <input
      id="le"
      type="email"
      placeholder="Email"
    >

    <input
      id="lp"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Login
    </button>

    <p id="loginMsg"></p>

  </div>

</div>


<!-- APP -->

<main id="app" style="display:none;">

  <div class="wrap">

    <section class="hero">

      <h1>Seller Dashboard</h1>

      <p>
        Add and manage your BUYZO products.
      </p>

    </section>


    <div class="grid">


      <!-- ADD PRODUCT -->

      <section class="box">

        <h2>Add Product</h2>

        <input
          id="name"
          type="text"
          placeholder="Product name"
        >

        <select id="category">

          <option value="Mobiles">Mobiles</option>
          <option value="Fashion">Fashion</option>
          <option value="Electronics">Electronics</option>
          <option value="Home">Home</option>
          <option value="Beauty">Beauty</option>
          <option value="Sports">Sports</option>

        </select>


        <input
          id="price"
          type="number"
          min="1"
          placeholder="Selling price ₹"
        >


        <input
          id="old"
          type="number"
          min="0"
          placeholder="MRP ₹ (optional)"
        >


        <input
          id="stock"
          type="number"
          min="0"
          value="1"
          placeholder="Stock quantity"
        >


        <label class="photo-title">
          Product Photo
        </label>

        <input
          id="productImage"
          type="file"
          accept="image/*"
          onchange="previewImage()"
        >


        <div
          id="previewBox"
          class="preview-box"
          style="display:none;"
        >

          <img id="imagePreview">

          <button
            type="button"
            onclick="removePreview()"
          >
            Remove
          </button>

        </div>


        <input
          id="emoji"
          type="text"
          placeholder="Emoji (optional) e.g. 👕"
        >


        <button
          class="primary add-btn"
          onclick="addProduct()"
        >
          Upload & Add Product
        </button>


        <p id="notice" class="notice"></p>

      </section>


      <!-- PRODUCTS -->

      <section class="box products-box">

        <div class="products-header">

          <h2>
            Your Products
            (<span id="count">0</span>)
          </h2>

          <button
            class="refresh"
            onclick="load()"
          >
            ↻ Refresh
          </button>

        </div>


        <div id="list"></div>

      </section>

    </div>

  </div>

</main>


<script src="seller.js"></script>

</body>
</html>
