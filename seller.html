<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BUYZO Seller Panel</title>

<link rel="stylesheet" href="./seller.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="top">

  <a href="./index.html" class="logo">
    BUY<span>ZO</span>
    <small>SELLER</small>
  </a>

  <div class="account">

    <span id="email"></span>

    <button type="button" onclick="logout()">
      Logout
    </button>

  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<section id="login" class="login-page">

  <div class="login-box">

    <div class="brand">
      BUY<span>ZO</span>
    </div>

    <h2>Seller Login</h2>

    <input
      id="le"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="lp"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      type="button"
      onclick="login()"
    >
      Login
    </button>

    <p id="loginMsg"></p>

  </div>

</section>


<!-- =========================
     SELLER APP
========================= -->

<main id="app" style="display:none">

  <section class="banner">

    <h1>Seller Dashboard</h1>

    <p>
      Add products and manage your BUYZO orders.
    </p>

  </section>


  <div id="notice"></div>


  <!-- =========================
       PRODUCTS
  ========================= -->

  <div class="layout">


    <!-- ADD PRODUCT -->

    <section class="card">

      <h2>➕ Add Product</h2>

      <input
        id="name"
        type="text"
        placeholder="Product name"
      >

      <select id="category">

        <option value="Mobiles">
          Mobiles
        </option>

        <option value="Fashion">
          Fashion
        </option>

        <option value="Electronics">
          Electronics
        </option>

        <option value="Home">
          Home
        </option>

        <option value="Beauty">
          Beauty
        </option>

        <option value="Sports">
          Sports
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <input
        id="price"
        type="number"
        min="1"
        placeholder="Selling price ₹"
      >


      <input
        id="old"
        type="number"
        min="0"
        placeholder="MRP ₹ (optional)"
      >


      <input
        id="stock"
        type="number"
        min="0"
        value="1"
        placeholder="Stock quantity"
      >


      <input
        id="emoji"
        type="text"
        placeholder="Emoji optional e.g. 📱"
      >


      <label>
        Product Photo
      </label>


      <input
        id="productImage"
        type="file"
        accept="image/*"
        onchange="previewImage()"
      >


      <img
        id="imagePreview"
        class="preview"
        style="display:none"
        alt="Preview"
      >


      <button
        class="add"
        type="button"
        onclick="addProduct()"
      >
        Add Product
      </button>

    </section>


    <!-- PRODUCT LIST -->

    <section class="card">

      <div class="listHead">

        <h2>
          Your Products
          (<span id="count">0</span>)
        </h2>


        <button
          type="button"
          onclick="load()"
        >
          ↻ Refresh
        </button>

      </div>


      <div id="list">

        <p>
          Login karke products dekho.
        </p>

      </div>

    </section>

  </div>


  <!-- =========================
       ORDERS
  ========================= -->

  <section class="card ordersCard">

    <div class="listHead">

      <div>

        <h2>
          📦 Customer Orders
          (<span id="orderCount">0</span>)
        </h2>

        <small>
          Orders for your products
        </small>

      </div>


      <button
        type="button"
        onclick="loadOrders()"
      >
        ↻ Refresh Orders
      </button>

    </div>


    <div id="ordersList">

      <div class="emptyOrders">

        <h3>
          📦 No orders yet
        </h3>

        <p>
          Customer order karega to yahan dikhega.
        </p>

      </div>

    </div>

  </section>

</main>


<!-- =========================
     ORDER MODAL
========================= -->

<div
  id="orderModal"
  class="modal"
  style="display:none"
>

  <div class="modalBox">

    <button
      class="modalClose"
      type="button"
      onclick="closeOrderModal()"
    >
      ✕
    </button>


    <div id="orderDetails"></div>

  </div>

</div>


<script src="./seller.js"></script>

</body>
</html>
